<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>抽一張｜破冰遊戲 Icebreaker Games</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Huninn&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EAF4F1; --surface:#FFFFFF; --ink:#1D2B33; --muted:#5B6B70;
  --teal:#1F7A72; --mango:#F2B134; --guava:#E86A6A; --line:#C9DED8;
  --slip:#FFF8E6; --slip-ink:#2B2416;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#12201F; --surface:#1B2D2B; --ink:#E6F0EE; --muted:#9DB2AE;
    --teal:#4CC2B4; --mango:#F5C25A; --guava:#F08A84; --line:#2C4542;
    --slip:#2A2618; --slip-ink:#F6EBCB; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#12201F; --surface:#1B2D2B; --ink:#E6F0EE; --muted:#9DB2AE;
  --teal:#4CC2B4; --mango:#F5C25A; --guava:#F08A84; --line:#2C4542;
  --slip:#2A2618; --slip-ink:#F6EBCB; color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;line-height:1.6;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:560px;margin:0 auto;padding:16px 18px 48px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:8px}
.brand{font-family:"Huninn","Noto Sans TC",sans-serif;font-size:1.25rem;background:none;border:0;color:var(--ink);padding:6px 0;cursor:pointer}
.toggle{font:inherit;font-size:.85rem;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 14px;cursor:pointer}
.toggle[aria-pressed="true"]{background:var(--teal);border-color:var(--teal);color:#fff}
h1,h2{font-family:"Huninn","Noto Sans TC",sans-serif;font-weight:400;margin:0}
h1{font-size:2.6rem;line-height:1.15;margin:18px 0 6px}
h2{font-size:1.7rem;line-height:1.2}
.en{display:block;font-size:.78em;color:var(--muted);font-family:system-ui,sans-serif;line-height:1.35;margin-top:2px}
.lead{color:var(--muted);margin:0 0 22px}
.games{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.game{text-align:left;font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:14px;cursor:pointer;min-height:112px;display:flex;flex-direction:column;gap:4px}
.game .ico{font-size:1.6rem;line-height:1}
.game b{font-family:"Huninn","Noto Sans TC",sans-serif;font-weight:400;font-size:1.15rem}
.game small{color:var(--muted);font-size:.8rem;line-height:1.4}
.game.wide{grid-column:1/-1;min-height:0;flex-direction:row;align-items:center;gap:12px}
.tag{display:inline-block;font-size:.7rem;background:var(--mango);color:#3A2A00;border-radius:6px;padding:1px 7px;margin-left:4px;vertical-align:2px}
.back{font:inherit;background:none;border:0;color:var(--teal);padding:8px 0;cursor:pointer;font-weight:500}
.howto{background:var(--surface);border-left:4px solid var(--mango);border-radius:0 10px 10px 0;padding:10px 14px;margin:14px 0;font-size:.92rem;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
.chip{font:inherit;font-size:.9rem;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:7px 14px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
/* the slip — the one memorable thing */
.slip{position:relative;background:var(--slip);color:var(--slip-ink);border-radius:18px 18px 10px 10px;padding:34px 24px 30px;margin:18px 0;min-height:230px;display:flex;flex-direction:column;justify-content:center;text-align:center;box-shadow:0 2px 0 var(--line)}
.slip::before{content:"";position:absolute;left:18px;right:18px;top:14px;border-top:2px dashed color-mix(in srgb,var(--slip-ink) 25%,transparent)}
.slip .kind{position:absolute;top:22px;left:0;right:0;font-size:.8rem;opacity:.65}
.slip .big{font-family:"Huninn","Noto Sans TC",sans-serif;font-size:1.65rem;line-height:1.35;overflow-wrap:anywhere}
.slip .big .en{color:inherit;opacity:.7;font-size:.62em;margin-top:8px}
.slip.huge .big{font-size:2.6rem}
.slip.empty .big{opacity:.5;font-size:1.2rem}
.slip.drawn{animation:pull .42s cubic-bezier(.2,.9,.3,1.2)}
@keyframes pull{from{transform:translateY(26px) rotate(-2deg);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.slip.drawn{animation:none}}
.slip.tod-truth{background:color-mix(in srgb,var(--teal) 16%,var(--slip))}
.slip.tod-dare{background:color-mix(in srgb,var(--guava) 20%,var(--slip))}
.reveal{margin-top:16px;padding-top:14px;border-top:2px dashed color-mix(in srgb,var(--slip-ink) 25%,transparent)}
.reveal .tg{font-family:"Huninn",sans-serif;font-size:1.9rem}
.reveal .rom{font-size:1.05rem;opacity:.8}
.btn{font:inherit;font-weight:700;font-size:1.05rem;border:0;border-radius:14px;padding:15px 18px;cursor:pointer;width:100%;background:var(--teal);color:#fff}
.btn.alt{background:var(--surface);color:var(--ink);border:1.5px solid var(--line);font-weight:500}
.btn.warn{background:var(--guava)}
.btn.sun{background:var(--mango);color:#3A2A00}
.row{display:flex;gap:10px;margin-top:10px}
.row>*{flex:1}
.meta{display:flex;justify-content:space-between;color:var(--muted);font-size:.85rem;margin-top:6px}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--mango);outline-offset:2px}
label.f{display:block;margin:12px 0 4px;font-size:.9rem;font-weight:500}
input,select,textarea{font:inherit;width:100%;padding:11px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink)}
textarea{min-height:150px;resize:vertical}
.inline{display:flex;gap:8px}
.inline input{flex:1}
.inline .btn{width:auto;padding:10px 14px;font-size:.9rem}
.timer{font-family:"Huninn",sans-serif;font-size:3rem;text-align:center;line-height:1}
.timer.low{color:var(--guava)}
.score{text-align:center;color:var(--muted)}
.list{list-style:none;padding:0;margin:10px 0}
.list li{padding:8px 12px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px}
.ok{color:var(--teal);font-weight:700}.no{color:var(--guava)}
.seg{display:flex;border:1.5px solid var(--line);border-radius:12px;overflow:hidden;margin:12px 0}
.seg button{flex:1;font:inherit;border:0;background:var(--surface);color:var(--ink);padding:10px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--teal);color:#fff}
.note{font-size:.82rem;color:var(--muted);margin-top:10px}
.cover{touch-action:manipulation;position:fixed;inset:0;z-index:20;background:var(--slip);color:var(--slip-ink);display:flex;align-items:center;justify-content:center;text-align:center;padding:30px}
.cover .big{font-family:"Huninn",sans-serif;font-size:clamp(2.4rem,11vw,5rem);line-height:1.2;overflow-wrap:anywhere}
.cover .big .en{color:inherit;opacity:.7;font-size:.4em}
.cover small{display:block;margin-top:30px;opacity:.6}
.result{background:var(--surface);border-radius:12px;padding:12px 14px;margin-top:12px}
.result h3{margin:0 0 6px;font-size:1rem}
.hs{position:fixed;inset:0;z-index:20;background:var(--slip);color:var(--slip-ink);touch-action:manipulation;user-select:none;-webkit-user-select:none}
.hs-word{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:70px 24px;pointer-events:none;font-family:"Huninn",sans-serif;font-size:clamp(2.6rem,12vw,6rem);line-height:1.15;z-index:1;overflow-wrap:anywhere}
.hs-word .en{color:inherit;opacity:.7;font-size:.4em;margin-top:10px}
.hs-top{position:absolute;top:calc(16px + env(safe-area-inset-top,0px));left:0;right:0;text-align:center;font-family:"Huninn",sans-serif;font-size:1.5rem;z-index:2;pointer-events:none}
.hs-zone{position:absolute;top:0;bottom:0;width:50%;border:0;font:inherit;color:inherit;font-size:1.1rem;display:flex;align-items:flex-end;justify-content:center;padding-bottom:calc(26px + env(safe-area-inset-bottom,0px));cursor:pointer}
.hs-zone.skip{left:0;background:color-mix(in srgb,var(--guava) 14%,transparent)}
.hs-zone.ok{right:0;background:color-mix(in srgb,var(--teal) 16%,transparent)}
.hs-zone:active{filter:brightness(.92)}
.hs-end{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:12px;z-index:3;font:inherit;font-size:1.1rem;width:40px;height:40px;border-radius:50%;border:0;background:color-mix(in srgb,var(--slip-ink) 12%,transparent);color:inherit;cursor:pointer}
.pool li{align-items:center;padding:6px 4px}
.pool .num{flex:0 0 2.4rem;height:2.4rem;border-radius:50%;background:var(--mango);color:#3A2A00;display:flex;align-items:center;justify-content:center;font-family:"Huninn",sans-serif;font-size:1.1rem}
.pool input{flex:1;padding:8px 10px}
.pool .del{flex:0 0 2.4rem;height:2.4rem;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);color:var(--guava);font-size:1rem;cursor:pointer}
.scene{background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:10px 14px;display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;margin-top:6px}
.scene .chip{grid-column:2;grid-row:1/3;font-size:.8rem;padding:6px 10px}
.mc{background:var(--slip);color:var(--slip-ink);border-radius:16px;padding:14px;margin:12px 0;text-align:center}
.mc .kind{font-size:.8rem;opacity:.65}
.mc .ev{font-family:"Huninn",sans-serif;font-size:1.35rem;line-height:1.35;min-height:3.2em;display:flex;flex-direction:column;align-items:center;justify-content:center;margin:6px 0 10px}
.mc .ev .en,.said .en{color:inherit;opacity:.7}
.arrow{display:flex;align-items:center;justify-content:space-between;margin-top:12px;gap:8px}
.arrow span{font-size:2.6rem;line-height:1;opacity:.18;cursor:pointer;transition:opacity .2s,transform .2s}
.arrow span.on{opacity:1;color:var(--teal);transform:scale(1.15)}
.arrow small{font-size:.85rem;line-height:1.3}
.arrow b{font-family:"Huninn",sans-serif;font-weight:400;font-size:1.2rem}
.actors{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.actor{background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:8px;min-width:0}
.actor.on{border-color:var(--teal);box-shadow:0 0 0 3px color-mix(in srgb,var(--teal) 25%,transparent)}
.aname{font-weight:700;text-align:center;font-size:.95rem}
.said{background:var(--slip);color:var(--slip-ink);border-radius:10px;padding:12px 8px;min-height:120px;font-family:"Huninn",sans-serif;font-size:1.05rem;line-height:1.4;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;overflow-wrap:anywhere}
.said.drawn,.mc .ev.drawn{animation:pull .42s cubic-bezier(.2,.9,.3,1.2)}
.actor .btn{padding:12px 8px;font-size:.95rem}
.clap{font:inherit;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:6px;cursor:pointer}
@media (prefers-reduced-motion:reduce){.said.drawn,.mc .ev.drawn{animation:none}}
.actor .btn:disabled,.mc .btn:disabled{opacity:.5;cursor:default}
.actor:not(.on){opacity:.75}
.script h3{margin:14px 0 6px;font-family:"Huninn",sans-serif;font-weight:400;font-size:1.15rem}
.script h3:first-child{margin-top:0}
.script .sn{margin:8px 0 2px;color:var(--muted);font-size:.92rem}
.script .sl{margin:0 0 6px;font-size:1.05rem}
.script .en{display:inline;margin-left:4px}
.hint{display:flex;gap:8px;align-items:center;justify-content:space-between;text-align:left;background:color-mix(in srgb,var(--slip-ink) 7%,transparent);border-radius:10px;padding:8px 10px;font-size:.92rem}
.hint .en{display:inline;margin-left:4px;color:inherit;opacity:.7}
.hint .chip{flex:0 0 auto;font-size:.8rem;padding:5px 10px}
.mc .chip{font-size:.85rem}
footer{color:var(--muted);font-size:.8rem;text-align:center;margin-top:30px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <button class="brand" onclick="go('home')">🎋 抽一張</button>
    <button class="toggle" id="enToggle" aria-pressed="true" onclick="toggleEN()">EN 字幕</button>
  </header>
  <main id="app"></main>
  <footer>離線也能玩・不收集任何資料<span class="en">Works offline · no data collected</span></footer>
</div>
<div id="coverHost"></div>

<script>
/* ================= 題庫 Content ================= */

// 同一個字串 → 同一串亂數（讓多台手機算出一樣的結果）
function seedFrom(str){ let h=1779033703^str.length; for(let i=0;i<str.length;i++){h=Math.imul(h^str.charCodeAt(i),3432918353);h=h<<13|h>>>19} return ()=>{h=Math.imul(h^h>>>16,2246822507);h=Math.imul(h^h>>>13,3266489909);return (h^=h>>>16)>>>0}; }
function rng(str){ let a=seedFrom(str)(); return ()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}; }
function shuffle(arr,r=Math.random){ const a=arr.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]} return a; }

// 不重複抽牌 deck
// 抽過的紀錄存在手機上，重新整理也不會重複
let decks={};
try{ decks=JSON.parse(localStorage.getItem('decks'))||{}; }catch(e){ decks={}; }
function saveDecks(){ try{localStorage.setItem('decks',JSON.stringify(decks))}catch(e){} }
function drawFrom(key,items){
  let d=Array.isArray(decks[key]) ? decks[key].filter(i=>Number.isInteger(i)&&i>=0&&i<items.length) : [];
  if(!d.length) d=shuffle(items.map((_,i)=>i));
  const i=d.pop(); decks[key]=d; saveDecks(); return items[i];
}
function resetDecks(){ if(!confirm('重置所有題庫？抽過的題目會重新洗回去。\nReset all decks?')) return; decks={}; saveDecks(); alert('已重新洗牌！ Reshuffled!'); }
function left(key){ return decks[key]?decks[key].length:0; }

function pool(){
  if(!S.pool){ try{S.pool=JSON.parse(localStorage.getItem('drawPool'))}catch(e){} }
  if(!S.pool||!Array.isArray(S.pool.items)) S.pool={items:Array.from({length:6},(_,i)=>({n:i+1,name:''})),remove:false};
  return S.pool;
}
function poolSave(){ try{localStorage.setItem('drawPool',JSON.stringify(S.pool))}catch(e){} }
function poolReset(){ const n=Math.max(2,Math.min(99,parseInt($('#pn').value)||6)); S.pool={items:Array.from({length:n},(_,i)=>({n:i+1,name:''})),remove:pool().remove}; S.drawOut=''; poolSave(); render(); }
function poolAdd(){ const P=pool(); const n=P.items.reduce((m,x)=>Math.max(m,x.n),0)+1; P.items.push({n,name:''}); poolSave(); render(); }
function poolDel(n){ const P=pool(); P.items=P.items.filter(x=>x.n!==n); poolSave(); render(); }
function poolName(n,v){ const it=pool().items.find(x=>x.n===n); if(it){it.name=v; poolSave();} }
const lbl = it => `${it.n} 號${it.name?'・'+esc(it.name):''}`;
function doDraw(mode){
  const P=pool(); S.grp=+($('#grp')||{}).value||S.grp||2;
  if(P.items.length<(mode==='one'?1:2)){ S.drawOut=`<div class="result">${T('名單裡的號碼不夠。','Not enough numbers in the list.')}</div>`; render(); return; }
  const sh=shuffle(P.items);
  if(mode==='one'){
    const it=sh[0];
    S.drawOut=`<div class="slip drawn"><div class="kind">${T('抽中','Picked')}</div><div class="big" style="font-size:3rem">${it.n} 號</div>${it.name?`<div style="font-size:1.4rem">${esc(it.name)}</div>`:''}</div>`;
    if(P.remove){ P.items=P.items.filter(x=>x.n!==it.n); poolSave(); }
  }
  if(mode==='order') S.drawOut=`<div class="result"><h3>${T('順序','Order')}</h3><ol>${sh.map(x=>`<li>${lbl(x)}</li>`).join('')}</ol></div>`;
  if(mode==='group'){ const n=S.grp; const g=Array.from({length:n},()=>[]); sh.forEach((x,i)=>g[i%n].push(x)); S.drawOut=g.map((m,i)=>`<div class="result"><h3>第 ${i+1} 組${showEN?' · Team '+(i+1):''}</h3>${m.map(lbl).join('、')||'—'}</div>`).join(''); }
  render();
}

/* ---------- 紙條劇場 logic ---------- */
function stState(){
  if(!S.st){ let saved={}; try{saved=JSON.parse(localStorage.getItem('storyBox'))||{}}catch(e){}
    S.st={phase:'setup',mode:'single',lines:Array.isArray(saved.lines)?saved.lines:[],builtin:saved.builtin!==false,nameA:'',nameB:'',code:newCode(),role:'A'}; }
  return S.st;
}
function stSave(){ try{localStorage.setItem('storyBox',JSON.stringify({lines:S.st.lines,builtin:S.st.builtin}))}catch(e){} }
function stClear(){ if(confirm('清空所有紙條？ Empty the box?')){ S.st.lines=[]; stSave(); render(); } }
function stNameRaw(side){ const st=S.st, n=side==='A'?st.nameA:st.nameB; return n||(side==='A'?'左邊':'右邊'); }
function stName(side){ const st=S.st, n=side==='A'?st.nameA:st.nameB; return n?esc(n):(side==='A'?'左邊':'右邊')+(showEN?(side==='A'?' · Left':' · Right'):''); }
function storyWrite(){
  const st=S.st;
  app.innerHTML = `<button class="back" onclick="S.st.phase='setup';render()">← 回設定${showEN?' · Back':''}</button>
  <h2>${T('寫紙條','Write slips')}</h2>
  ${howto('寫一句等一下會被「別人」照念的台詞。越無厘頭、越肉麻、越日常都好，例如「廁所沒紙了」。放進去後內容不會顯示，寫完把手機交給下一位。','Write a line someone else will read out loud, like “We’re out of toilet paper.” It stays hidden once added — then pass the phone.')}
  <label class="f" for="stIn">台詞${showEN?' · Line':''}</label>
  <textarea id="stIn" maxlength="80" style="min-height:96px" placeholder="例如：廁所沒紙了。"></textarea>
  <button class="btn" style="margin-top:10px" onclick="stAdd()">放進紙條箱 📥${showEN?' · Add':''}</button>
  <p class="score" id="stCount" aria-live="polite">${T(`紙條箱裡有 ${st.lines.length} 張`,`${st.lines.length} slips in the box`)}</p>
  <button class="btn alt" onclick="S.st.phase='setup';render()">大家都寫好了 ✓${showEN?' · Everyone\'s done':''}</button>`;
  $('#stIn').focus();
}
function stAdd(){
  const el=$('#stIn'), v=el.value.trim(); if(!v) return;
  S.st.lines.push(v); stSave(); el.value=''; el.focus();
  const n=S.st.lines.length;
  $('#stCount').innerHTML=`✓ ${T(`放進去了！紙條箱裡有 ${n} 張`,`Added! ${n} slips in the box`)}`;
}
function stStart(){
  const st=S.st;
  st.script=[]; st.lastA=null; st.lastB=null; st.fresh=null;
  if(st.mode==='single'){
    const pool=st.lines.map(x=>[x,'',1]).concat(st.builtin?STORY_LINES:[]);
    if(pool.length<6){ alert('紙條至少要 6 張，可以多寫幾張或混入內建台詞。\nAdd at least 6 slips, or mix in built-in lines.'); return; }
    st.pool=shuffle(pool);
  } else {
    const deck=shuffle(STORY_LINES,rng('st|'+st.code));
    st.mine=st.role==='N'?[]:deck.filter((_,i)=>i%2===(st.role==='A'?0:1));
    st.mi=0;
  }
  st.phase='play'; keepAwake();
  if(st.host==='free'){ st.tale={t:['即興主持','Improvised'],beats:[]}; st.bi=0; st.need=[]; st.speaking=[]; st.cur=null; st.hint=drawFrom('st-br',STORY_BRIDGES); st.lastA=null; st.lastB=null; st.script.push({who:'T',t:st.tale.t}); render(); }
  else stNewTale();
}
function stHint(){ S.st.hint=drawFrom('st-br',STORY_BRIDGES); render(); }
function stPoint(sides,useHint){
  const st=S.st; if(st.need.length) return;
  st.cur = useHint ? st.hint : null;
  st.script.push({who:'N',t: useHint ? st.hint : ['（主持人即興）','(host improvises)']});
  st.speaking=sides; st.need = st.mode==='multi' ? [] : sides.slice();
  st.hint=drawFrom('st-br',STORY_BRIDGES); st.fresh='E'; render();
}
function freeNarratorHTML(){
  const st=S.st, sp=st.speaking||[], waiting=st.need.length>0;
  const who = sp.length===2 ? T('兩個人一起','Both of you') : sp.length ? `<b>${stName(sp[0])}</b>` : '';
  return `<div class="mc">
    <div class="kind">🎙️ ${T('主持人即興','Host improvises')}</div>
    <div class="ev ${st.fresh==='E'?'drawn':''}">${st.cur?T(st.cur[0],st.cur[1]):`<span style="opacity:.6">${sp.length?T('（主持人自己接了一句）','(the host made up a bridge)'):T('先起個頭設定情境，再指定誰先開紙條','Set the scene, then pick who opens first')}</span>`}</div>
    ${sp.length?`<div class="arrow" aria-live="polite"><span class="${sp.includes('A')?'on':''}">⬅</span><small>${T('換這位念紙條','Read your slip')}<br>${who}</small><span class="${sp.includes('B')?'on':''}">➡</span></div>`:''}
    ${waiting?`<button class="btn alt" disabled>等 ${st.need.map(stName).join('、')} 打開紙條…</button>`:`
      <div class="hint"><span>💡 ${T('轉場提示','Bridge idea')}：${T(st.hint[0],st.hint[1])}</span><button class="chip" onclick="stHint()">換一個</button></div>
      <label class="f" style="margin-top:10px">${T('接下來誰念？','Who reads next?')}</label>
      <div class="row" style="margin-top:4px">
        <button class="btn" onclick="stPoint(['A'],S.st.useHint)">⬅ 左邊</button>
        <button class="btn alt" onclick="stPoint(['A','B'],S.st.useHint)">一起</button>
        <button class="btn" onclick="stPoint(['B'],S.st.useHint)">右邊 ➡</button>
      </div>
      <button class="chip" style="margin-top:10px" aria-pressed="${!!st.useHint}" onclick="S.st.useHint=!S.st.useHint;render()">${st.useHint?'☑':'☐'} ${T('我要照念這句提示','I’ll read this prompt')}</button>`}
  </div>`;
}
function stNewTale(){
  const st=S.st;
  st.tale=drawFrom('st-tale',STORY_TALES); st.bi=-1; st.need=[]; st.turn=Math.random()<.5?'A':'B'; st.lastA=null; st.lastB=null;
  st.script.push({who:'T',t:st.tale.t});
  render();
}
function stNext(){
  const st=S.st;
  if(st.need.length) return;
  st.bi++;
  const beat=st.tale.beats[st.bi];
  if(!beat){ st.fresh=null; render(); return; }
  st.script.push({who:'N',t:[beat[0],beat[1]]});
  if(beat[2]==='b'){ st.need=['A','B']; }
  else { st.need=[st.turn]; st.turn=st.turn==='A'?'B':'A'; }
  if(st.mode==='multi') st.need=[]; // 多機：主持人手機不等演員
  st.speaking = beat[2]==='b' ? ['A','B'] : [st.turn==='A'?'B':'A'];
  st.fresh='E'; render();
}
function stPull(side){
  const st=S.st;
  if(!st.need.includes(side)) return;
  if(!st.pool.length){ alert('紙條用完了！ Out of slips!'); stEnd(); return; }
  const line=st.pool.pop(); st['last'+side]=line;
  st.script.push({who:side,line});
  st.need=st.need.filter(x=>x!==side);
  st.fresh=side; if(navigator.vibrate)navigator.vibrate(20); render();
}
function stEnd(){ S.st.phase='end'; render(); }
const lineT = l => l[2] ? esc(l[0]) : T(l[0],l[1]);
function narratorHTML(){
  if(S.st.host==='free') return freeNarratorHTML();
  const st=S.st, beat=st.tale.beats[st.bi], done=st.bi>=st.tale.beats.length, sp=st.speaking||[];
  const waiting=st.need.length>0;
  const who = sp.length===2 ? T('兩個人一起','Both of you') : sp.length ? `<b>${stName(sp[0])}</b>` : '';
  let btn;
  if(done) btn=`<div class="row" style="margin-top:0"><button class="btn sun" onclick="stNewTale()">下一個故事 ▶${showEN?'<br><small>Next story</small>':''}</button><button class="btn alt" onclick="stEnd()">看完整劇本${showEN?'<br><small>Full script</small>':''}</button></div>`;
  else if(waiting) btn=`<button class="btn alt" disabled>等 ${st.need.map(stName).join('、')} 抽紙條…${showEN?'<br><small>Waiting for the slip</small>':''}</button>`;
  else btn=`<button class="btn sun" onclick="stNext()">${st.bi<0?'開始念旁白 ▶':'下一句旁白 ▶'}${showEN?(st.bi<0?'<br><small>Start</small>':'<br><small>Next line</small>'):''}</button>`;
  return `<div class="mc">
    <div class="kind">🎙️ ${T('主持人念','Narrator reads')} · 《${esc(st.tale.t[0])}》${showEN?' '+esc(st.tale.t[1]):''}</div>
    <div class="ev ${st.fresh==='E'?'drawn':''}">${done?T('全劇終 🎬','The end'):beat?T(beat[0],beat[1]):`<span style="opacity:.55">${T('按下面開始','Tap below to begin')}</span>`}</div>
    ${beat&&!done?`<div class="arrow" aria-live="polite"><span class="${sp.includes('A')?'on':''}">⬅</span><small>${T('換這位念紙條','Read your slip')}<br>${who}</small><span class="${sp.includes('B')?'on':''}">➡</span></div>`:''}
    ${btn}
  </div>`;
}
function storyPlay(){
  const st=S.st;
  const panel=side=>{ const on=st.need.includes(side), last=st['last'+side];
    return `<div class="actor ${on?'on':''}">
      <div class="aname">${side==='A'?'⬅ ':''}${stName(side)}${side==='B'?' ➡':''}</div>
      <div class="said ${st.fresh===side?'drawn':''}">${last?lineT(last):'<span style="opacity:.45">📜</span>'}</div>
      <button class="btn ${on?'':'alt'}" ${on?'':'disabled'} onclick="stPull('${side}')">${on?'打開紙條':'還沒輪到'}${showEN?(on?'<br><small>Open slip</small>':'<br><small>Not your turn</small>'):''}</button>
    </div>`; };
  app.innerHTML = `${narratorHTML()}
  <div class="actors">${panel('A')}${panel('B')}</div>
  <div class="meta"><span>${T(`紙條箱剩 ${st.pool.length} 張`,`${st.pool.length} slips left`)}</span><button class="back" onclick="stEnd()">結束${showEN?' · End':''}</button></div>`;
}
function storyMulti(){
  const st=S.st;
  if(st.role==='N'){
    app.innerHTML = `<button class="back" onclick="S.st.phase='setup';render()">← 回設定</button>${narratorHTML()}
    <p class="note">${T('多機版：念完旁白後，等被箭頭指到的人在自己手機打開紙條念完，再按下一句。','Wait for the pointed actor to read from their phone, then tap next.')}</p>`;

  }

  <h2>${stName(st.role)}</h2>
  <div class="slip ${st.fresh==='M'?'drawn':''} ${prev?'':'empty'}"><div class="kind">${T('你的台詞','Your line')}</div><div class="big">${prev?T(prev[0],prev[1]):T('箭頭指到你時再打開','Open when the arrow points at you')}</div></div>
  ${line?`<button class="btn" onclick="S.st.mi++;S.st.fresh='M';render()">📜 打開下一張${showEN?' · Open next':''}</button>`:`<button class="btn alt" onclick="S.st.phase='setup';render()">台詞用完了，換個房間碼再玩${showEN?' · Out of lines':''}</button>`}
  <p class="score">${T(`還有 ${st.mine.length-st.mi} 張`,`${st.mine.length-st.mi} left`)}</p>
  <p class="note">${T('左右兩位演員要用同一個房間碼，台詞才不會重複。','Both actors must use the same room code so lines don\'t repeat.')}</p>`;
}
function scriptText(){
  return S.st.script.map(x=> x.who==='T' ? `\n《${x.t[0]}》` : x.who==='N' ? `🎙️ ${x.t[0]}` : `${x.who==='A'?'⬅':'➡'} ${stNameRaw(x.who)}：「${x.line[0]}」`).join('\n').trim();
}
function stCopy(){

  const done=()=>{ const b=$('#cpy'); if(b) b.textContent='✓ 已複製'; };
  try{ navigator.clipboard.writeText(txt).then(done,()=>prompt('複製這段劇本：',txt)); }catch(e){ prompt('複製這段劇本：',txt); }
}
function storyEnd(){
  const st=S.st;
  app.innerHTML = `${backBtn()}
  <h2>${T('完整劇本 🎬','The full script')}</h2>
  <div class="result script">${(st.script||[]).map(x=> x.who==='T' ? `<h3>《${esc(x.t[0])}》${showEN?' '+esc(x.t[1]):''}</h3>`

}

/* ---------- 房間碼遊戲（多機 / 單機）---------- */
function newCode(){ const ch='ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; let s=''; for(let i=0;i<4;i++) s+=ch[Math.floor(Math.random()*ch.length)]; return s; }
function roomDefaults(){ if(!S.room) S.room={code:newCode(),n:5,seat:1,spies:1,round:1,mode:'multi'}; return S.room; }
function suggestedSpies(n){ return n>=10?3:n>=6?2:1; }

function ucDeal(r){
  const R=rng(`uc|${r.code}|${r.round}|${r.n}|${r.spies}`);
  const pair=UNDERCOVER[Math.floor(R()*UNDERCOVER.length)];
  const flip=R()<.5;
  const civ=flip?pair[1]:pair[0], spy=flip?pair[0]:pair[1];
  const seats=shuffle(Array.from({length:r.n},(_,i)=>i+1),R);
  const spySeats=seats.slice(0,r.spies).sort((a,b)=>a-b);
  const starter=1+Math.floor(R()*r.n);
  return {civ,spy,spySeats,starter,wordFor:s=>spySeats.includes(s)?spy:civ};
}
function roomGame(kind){
  const r=roomDefaults();
  const isUC=kind==='uc';
  const title=isUC?T('誰是臥底','Undercover'):T('我是誰','Who am I?');
  const help=isUC
    ? howto('大部分人拿到同一個詞，臥底拿到相似但不同的詞（臥底自己不知道）。輪流用一句話描述，然後投票找出臥底。','Most players get the same word; the undercover gets a similar one (and doesn\'t know it). Describe your word in one sentence, then vote.')
    : howto('每人輸入同一個房間碼和自己的號碼，按「舉到額頭」後把手機面向大家。用是非題問別人，猜出自己是誰。','Everyone enters the same room code and their own number. Tap “Forehead”, hold the phone facing out, and ask yes/no questions to guess who you are.');
  app.innerHTML = `${backBtn()}
  <h2>${title}</h2>
  ${help}
  ${isUC?`<div class="seg">
    <button aria-pressed="${r.mode==='multi'}" onclick="S.room.mode='multi';render()">每人一支手機${showEN?'<br><small>One phone each</small>':''}</button>
    <button aria-pressed="${r.mode==='pass'}" onclick="S.room.mode='pass';render()">傳一支手機${showEN?'<br><small>Pass one phone</small>':''}</button>
  </div>`:''}
  ${r.mode==='multi'?`
  <label class="f" for="rc">房間碼（大家要一樣）${showEN?' · Room code (same for everyone)':''}</label>
  <div class="inline"><input id="rc" value="${esc(r.code)}" maxlength="12" autocapitalize="characters" oninput="S.room.code=this.value.trim().toUpperCase()"><button class="btn alt" onclick="S.room.code=newCode();S.room.round=1;render()">換一個</button></div>`:''}
  <div class="row">
    <div><label class="f" for="rn">總人數${showEN?' · Players':''}</label>
      <select id="rn" onchange="S.room.n=+this.value;S.room.spies=suggestedSpies(S.room.n);if(S.room.seat>S.room.n)S.room.seat=1;render()">${Array.from({length:isUC?10:12},(_,i)=>i+3).map(n=>`<option ${n===r.n?'selected':''}>${n}</option>`).join('')}</select></div>
    ${r.mode==='multi'?`<div><label class="f" for="rs">我是幾號${showEN?' · My number':''}</label>
      <select id="rs" onchange="S.room.seat=+this.value">${Array.from({length:r.n},(_,i)=>i+1).map(n=>`<option ${n===r.seat?'selected':''}>${n}</option>`).join('')}</select></div>`:''}
    ${isUC?`<div><label class="f" for="rk">臥底數${showEN?' · Undercover':''}</label>
      <select id="rk" onchange="S.room.spies=+this.value">${[1,2,3].filter(k=>k<r.n-1).map(k=>`<option ${k===r.spies?'selected':''}>${k}</option>`).join('')}</select></div>`:''}
  </div>
  <p class="score" style="margin-top:14px">第 ${r.round} 局${showEN?' · Round '+r.round:''}</p>
  ${r.mode==='multi'
    ? `<button class="btn" onclick="${isUC?'showMyWord()':'showForehead()'}">${isUC?'看我的詞':'舉到額頭'}${showEN?(isUC?' · See my word':' · Forehead'):''}</button>`
    : `<button class="btn" onclick="startPass()">開始發詞${showEN?' · Deal words':''}</button>`}
  <div class="row">
    <button class="btn alt" onclick="showStarter('${kind}')">誰先開始？${showEN?'<br><small>Who starts?</small>':''}</button>
    <button class="btn alt" onclick="${isUC?'revealUC()':'revealWA()'}">公布答案${showEN?'<br><small>Reveal all</small>':''}</button>
  </div>
  ${isUC?`<div class="row">
    <select id="pk" aria-label="號碼">${Array.from({length:r.n},(_,i)=>`<option value="${i+1}">${i+1} 號</option>`).join('')}</select>
    <button class="btn alt" onclick="peekSeat()">查看這號身分${showEN?'<br><small>Check one player</small>':''}</button>
  </div>`:''}
  <div class="row"><button class="btn sun" onclick="S.room.round++;S.out='';S.ucPassDeal=null;render()">下一局${showEN?' · Next round':''}</button></div>
  <p class="note">${r.mode==='multi'?'每支手機的房間碼、總人數、局數都要一樣，號碼各自不同。大家一起按「下一局」。':'依序把手機交給 1 號、2 號…每人看完按「我記住了」再傳下去。'}${showEN?`<span class="en">${r.mode==='multi'?'Room code, player count and round must match on every phone; numbers differ. Tap “Next round” together.':'Pass the phone to player 1, 2, 3… Each taps “Got it” before passing on.'}</span>`:''}</p>
  <div id="roomOut">${S.out||''}</div>`;
}
function showMyWord(){
  const r=S.room, d=ucDeal(r), w=d.wordFor(r.seat);
  cover(`<div><div style="opacity:.6">${r.seat} 號的詞${showEN?' · Player '+r.seat:''}</div><div class="big">${T(w[0],w[1])}</div><small>點一下隱藏${showEN?' · Tap to hide':''}</small></div>`, closeCover);
}
function startPass(){ S.pass={i:1,d:ucDeal({...S.room,code:'P'+Date.now()})}; S.passKey=S.pass.d; passStep(false); }
function passStep(showing){
  const p=S.pass, r=S.room;
  if(p.i>r.n){ closeCover(); S.ucPassDeal=p.d; S.out=`<div class="result">${T('所有人都看完了，開始輪流描述！','Everyone has seen their word. Start describing!')}</div>`; render(); return; }
  if(!showing){
    cover(`<div><div style="opacity:.6">${T('請把手機交給','Pass the phone to')}</div><div class="big">${p.i} 號${showEN?'<span class="en">Player '+p.i+'</span>':''}</div><small>${T('準備好了點一下看詞','Tap when ready to see your word')}</small></div>`, ()=>passStep(true));
  } else {
    const w=p.d.wordFor(p.i);
    cover(`<div><div style="opacity:.6">${p.i} 號${showEN?' · Player '+p.i:''}</div><div class="big">${T(w[0],w[1])}</div><small>${T('記住後點一下，交給下一位','Tap once memorized, then pass on')}</small></div>`, ()=>{ p.i++; passStep(false); });
  }
}
function showStarter(kind){
  const r=S.room;
  const d = (kind==='uc' && r.mode==='pass' && S.ucPassDeal) ? S.ucPassDeal : ucDeal(r);
  S.out=`<div class="result"><h3>${T('從這位開始','Starts with')}</h3><div style="font-family:Huninn,sans-serif;font-size:2rem">${d.starter} 號${showEN?' · Player '+d.starter:''}</div>${T('然後順時針輪流。','Then go clockwise.')}</div>`;
  render();
}
function peekSeat(){
  const r=S.room, seat=+$('#pk').value;
  if(r.mode==='pass'&&!S.ucPassDeal){ S.out=`<div class="result">${T('還沒發詞。','Words haven\'t been dealt yet.')}</div>`; render(); return; }
  if(!confirm(`查看 ${seat} 號的身分？ Check player ${seat}?`)) return;
  const d=(r.mode==='pass')?S.ucPassDeal:ucDeal(r);
  const spy=d.spySeats.includes(seat);
  const left=d.spySeats.length;
  S.out=`<div class="result"><h3>${seat} 號${showEN?' · Player '+seat:''}</h3><div style="font-family:Huninn,sans-serif;font-size:2rem;color:${spy?'var(--guava)':'var(--teal)'}">${spy?T('是臥底！','Undercover!'):T('是平民','Civilian')}</div><p class="note">${T(`這局共有 ${left} 個臥底。只公布身分，不公布詞。`,`${left} undercover this round. Only the role is shown, not the word.`)}</p></div>`;
  render();
}
function revealUC(){
  if(!confirm('確定要公布答案？ Reveal the answer?')) return;
  const r=S.room, d=(r.mode==='pass'&&S.ucPassDeal)?S.ucPassDeal:ucDeal(r);
  if(r.mode==='pass'&&!S.ucPassDeal){ S.out=`<div class="result">${T('還沒發詞。','Words haven\'t been dealt yet.')}</div>`; render(); return; }
  S.out=`<div class="result"><h3>${T('平民的詞','Civilian word')}</h3>${T(d.civ[0],d.civ[1])}</div>
  <div class="result"><h3>${T('臥底的詞','Undercover word')}</h3>${T(d.spy[0],d.spy[1])}</div>
  <div class="result"><h3>${T('臥底是','Undercover player(s)')}</h3><div style="font-family:Huninn,sans-serif;font-size:1.8rem">${d.spySeats.join('、')} 號</div></div>`;
  render();
}
function cover(html,onTap,dbl){
  const host=$('#coverHost');
  host.innerHTML=`<div class="cover" role="dialog" aria-modal="true" tabindex="0">${html}</div>`;
  const el=host.firstChild; el.focus();
  if(onTap) el.addEventListener('click',onTap,{once:true});
  if(dbl) el.addEventListener('dblclick',closeCover,{once:true});
}
function closeCover(){ const h=$('#coverHost'); if(h) h.innerHTML=''; }
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeCover(); });

/* ---------- 啟動 ---------- */
syncToggle();
const start=(location.hash||'').slice(1);
S.view = VIEWS[start] ? start : 'home';
render();
window.addEventListener('hashchange',()=>{ const v=(location.hash||'').slice(1)||'home'; if(v!==S.view && VIEWS[v]){ S.view=v; clearInterval(S.timerId); closeCover(); render(); } });
</script>
